name: Windows Installer

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build:
    name: Build installer on windows
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Download Inno Setup
      uses: suisei-cn/actions-download-file@v1
      with:
        url: https://files.jrsoftware.org/is/6/innosetup-6.2.2.exe
        target: ../
    - name: Install Inno Setup
      run: '../innosetup-6.2.2.exe /VERYSILENT /NORESTART /ALLUSERS'
    - name: Set version
      run: |
        $version = "${{ github.event.release.tag_name }}"
        if ($version -match '^v(.+)') {
          $version = $matches[1]
        }
        $version | Out-File -NoNewline -FilePath ./VERSION
      shell: pwsh
    - name: Build QuestPatcher
      run: dotnet publish QuestPatcher/QuestPatcher.csproj -c Release -r win-x64 --self-contained
    - name: Compile Installer
      run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/installer.iss'
    - name: Upload Release Asset
      id: upload-release-asset 
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./installer/QuestPatcher-windows.exe
        asset_name: QuestPatcher-windows.exe
        asset_content_type: application/octet-stream